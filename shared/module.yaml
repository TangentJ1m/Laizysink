product:
  type: kmp/lib
  platforms: [ jvm, android ]

dependencies:
  - io.ktor:ktor-client-core:3.3.0
  - io.ktor:ktor-client-websockets:3.3.0
  - io.ktor:ktor-client-content-negotiation:3.3.0
  - io.ktor:ktor-serialization-kotlinx-json:3.3.0
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

dependencies@android:
  - $compose.uiTooling
  - io.ktor:ktor-client-okhttp:3.3.0

dependencies@jvm:
  - io.ktor:ktor-client-cio:3.3.0

settings:
  jvm:
    jdk:
      version: 25
      distributions: [ temurin ]
  kotlin:
    serialization: json
  compose:
    enabled: true
    resources:
      packageName: com.onecaramel.laizysink.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true



